<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>제일테크노스 통합 노무 관리 시스템</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 및 ReactDOM 로드 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel 컴파일러 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #EBEBDF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 30분 단위 시간 선택 목록 (06:00 ~ 23:30)
    const TIME_OPTIONS = [];
    for (let h = 6; h <= 23; h++) {
      const hh = String(h).padStart(2, '0');
      TIME_OPTIONS.push(`${hh}:00`);
      TIME_OPTIONS.push(`${hh}:30`);
    }

    // 정확한 구글 Apps Script Web App URL 단일 고정
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxp5G9FGPlO-R_PAYSHtJ9F-3lVk0GoFWljqXbDHT7u23SBkwNi3dtXsp57yLyEo-1NOw/exec';

    function App() {
      const [currentView, setCurrentView] = useState('register'); // 'register' | 'history'
      const [selectedFactory, setSelectedFactory] = useState('1공장');
      const [scriptUrl, setScriptUrl] = useState(localStorage.getItem('gas_url') || DEFAULT_GAS_URL);
      const [showSettings, setShowSettings] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('worker_records');
        return saved ? JSON.parse(saved) : [];
      });

      const getTodayDate = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const getDayOfWeek = (dateStr) => {
        if (!dateStr) return '';
        const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
        const date = new Date(dateStr);
        return isNaN(date.getDay()) ? '' : days[date.getDay()];
      };

      const [formData, setFormData] = useState({
        workDate: getTodayDate(),
        dayOfWeek: getDayOfWeek(getTodayDate()),
        workerName: '',
        inTime: '08:00',
        outTime: '17:00',
        checker: '',
        reason: '',
        notes: ''
      });

      const handleDateChange = (e) => {
        const newDate = e.target.value;
        setFormData(prev => ({
          ...prev,
          workDate: newDate,
          dayOfWeek: getDayOfWeek(newDate)
        }));
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      useEffect(() => {
        localStorage.setItem('worker_records', JSON.stringify(records));
      }, [records]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.workerName.trim()) {
          alert('현장 인원 성명을 입력해 주세요.');
          return;
        }
        if (!formData.checker.trim()) {
          alert('현장확인자(관리자) 성명을 입력해 주세요.');
          return;
        }

        const newRecord = {
          id: 'REC_' + new Date().getTime(),
          factory: selectedFactory,
          ...formData,
          createdAt: new Date().toLocaleString()
        };

        // 구글 앱스스크립트 전송
        const targetUrl = scriptUrl.trim() || DEFAULT_GAS_URL;
        try {
          await fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newRecord)
          });
        } catch (err) {
          console.error('구글시트 전송 실패:', err);
        }

        setRecords(prev => [newRecord, ...prev]);
        showToast('관리본부로 자료 전송 완료!');

        setFormData(prev => ({
          ...prev,
          workerName: '',
          inTime: '08:00',
          outTime: '17:00',
          reason: '',
          notes: ''
        }));
      };

      const handleDeleteRecord = (id) => {
        if (confirm('해당 출퇴근 내역을 삭제하시겠습니까?')) {
          setRecords(prev => prev.filter(r => r.id !== id));
          showToast('내역이 정상적으로 삭제되었습니다.');
        }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#EBEBDF] flex flex-col shadow-2xl pb-10">
          
          {/* 상단 헤더 영역 */}
          <header className="bg-[#191265] text-white px-5 py-4 shadow-lg sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center border border-white/20 text-yellow-400">
                <i className="fa-solid fa-helmet-safety text-lg"></i>
              </div>
              <div>
                <p className="text-[11px] text-[#EBEBDF] font-medium opacity-90 tracking-wide">
                  제일테크노스 통합 노무 관리 시스템
                </p>
                <h1 className="text-lg font-extrabold tracking-tight">
                  현장 인원 출퇴근 관리
                </h1>
              </div>
            </div>
            <button 
              onClick={() => setShowSettings(!showSettings)}
              className="p-2.5 rounded-full hover:bg-white/10 text-white/80 transition-all text-sm"
              title="구글 연동 설정"
            >
              <i className="fa-solid fa-cloud-arrow-up"></i>
            </button>
          </header>

          {/* 설정 모달 */}
          {showSettings && (
            <div className="bg-white m-3 p-4 rounded-xl shadow-md border border-slate-300">
              <h3 className="text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                <i className="fa-solid fa-link text-[#191265]"></i> 구글 앱스스크립트 URL 설정
              </h3>
              <input 
                type="text"
                value={scriptUrl}
                onChange={(e) => {
                  setScriptUrl(e.target.value);
                  localStorage.setItem('gas_url', e.target.value);
                }}
                className="w-full text-xs p-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#191265]"
              />
              <p className="text-[11px] text-slate-500 mt-1">
                * 관리본부 구글 스프레드시트와 실시간 연동되어 있습니다.
              </p>
            </div>
          )}

          {/* 업무 탭 전환 */}
          <div className="flex bg-white mx-3 mt-3 rounded-xl p-1 shadow-sm border border-slate-200">
            <button
              onClick={() => setCurrentView('register')}
              className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                currentView === 'register' 
                  ? 'bg-[#191265] text-white shadow' 
                  : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              <i className="fa-solid fa-pen-to-square"></i> 출퇴근 등록
            </button>
            <button
              onClick={() => setCurrentView('history')}
              className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                currentView === 'history' 
                  ? 'bg-[#191265] text-white shadow' 
                  : 'text-slate-600 hover:text-slate-900'
              }`}
            >
              <i className="fa-solid fa-list-check"></i> 월별 내역 / 수정
            </button>
          </div>

          {/* 출퇴근 등록 뷰 */}
          {currentView === 'register' && (
            <div className="p-3">
              {/* 작업 공장 구분 */}
              <div className="mb-3">
                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                  <i className="fa-solid fa-industry mr-1 text-[#191265]"></i> 작업 공장 구분 <span className="text-red-500">*</span>
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => setSelectedFactory('1공장')}
                    className={`py-3 rounded-xl font-extrabold text-sm transition-all border flex items-center justify-center gap-1.5 ${
                      selectedFactory === '1공장'
                        ? 'bg-[#191265] text-white border-[#191265] shadow-md'
                        : 'bg-white text-slate-700 border-slate-300'
                    }`}
                  >
                    <i className="fa-solid fa-building"></i> 1공장 현장
                  </button>
                  <button
                    type="button"
                    onClick={() => setSelectedFactory('3공장')}
                    className={`py-3 rounded-xl font-extrabold text-sm transition-all border flex items-center justify-center gap-1.5 ${
                      selectedFactory === '3공장'
                        ? 'bg-[#191265] text-white border-[#191265] shadow-md'
                        : 'bg-white text-slate-700 border-slate-300'
                    }`}
                  >
                    <i className="fa-solid fa-ship"></i> 3공장 현장
                  </button>
                </div>
              </div>

              {/* 입력 양식 카드 */}
              <form onSubmit={handleSubmit} className="bg-white rounded-2xl p-4 shadow-md border border-slate-200 space-y-3.5">
                
                {/* 투입일자 & 요일 */}
                <div className="grid grid-cols-5 gap-2">
                  <div className="col-span-3">
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      <i className="fa-regular fa-calendar mr-1 text-[#191265]"></i> 투입일자 <span className="text-red-500">*</span>
                    </label>
                    <input 
                      type="date"
                      value={formData.workDate}
                      onChange={handleDateChange}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-[#191265]"
                      required
                    />
                  </div>
                  <div className="col-span-2">
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      <i className="fa-regular fa-calendar-check mr-1 text-[#191265]"></i> 요일 (자동)
                    </label>
                    <input 
                      type="text"
                      value={formData.dayOfWeek}
                      readOnly
                      className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-blue-900 text-center"
                    />
                  </div>
                </div>

                {/* 성명 */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    <i className="fa-solid fa-user mr-1 text-[#191265]"></i> 현장 인원 성명 <span className="text-red-500">*</span>
                  </label>
                  <input 
                    type="text"
                    placeholder="성명을 입력하세요 (예: 홍길동)"
                    value={formData.workerName}
                    onChange={(e) => setFormData({...formData, workerName: e.target.value})}
                    className="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold focus:ring-2 focus:ring-[#191265]"
                    required
                  />
                </div>

                {/* 출퇴근 시간 (30분 단위) */}
                <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      <i className="fa-solid fa-clock mr-1 text-emerald-600"></i> 출근시간
                    </label>
                    <select
                      value={formData.inTime}
                      onChange={(e) => setFormData({...formData, inTime: e.target.value})}
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                    >
                      {TIME_OPTIONS.map(t => <option key={`in-${t}`} value={t}>{t}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">
                      <i className="fa-solid fa-person-walking-arrow-right mr-1 text-rose-600"></i> 퇴근시간
                    </label>
                    <select
                      value={formData.outTime}
                      onChange={(e) => setFormData({...formData, outTime: e.target.value})}
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                    >
                      {TIME_OPTIONS.map(t => <option key={`out-${t}`} value={t}>{t}</option>)}
                    </select>
                  </div>
                </div>

                {/* 현장확인자 */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    <i className="fa-solid fa-user-check mr-1 text-[#191265]"></i> 현장확인자 (관리자) <span className="text-red-500">*</span>
                  </label>
                  <input 
                    type="text"
                    placeholder="예: 김반장 / 이직장"
                    value={formData.checker}
                    onChange={(e) => setFormData({...formData, checker: e.target.value})}
                    className="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-bold focus:ring-2 focus:ring-[#191265]"
                    required
                  />
                </div>

                {/* 투입사유 */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    <i className="fa-solid fa-wrench mr-1 text-[#191265]"></i> 투입사유
                  </label>
                  <input 
                    type="text"
                    placeholder="예: 홍길동 연차휴가 / 김제일 병가"
                    value={formData.reason}
                    onChange={(e) => setFormData({...formData, reason: e.target.value})}
                    className="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-[#191265]"
                  />
                </div>

                {/* 기타사항 */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    <i className="fa-solid fa-note-sticky mr-1 text-[#191265]"></i> 기타사항
                  </label>
                  <input 
                    type="text"
                    placeholder="예: 12:00 퇴근사유(오전근무) 등"
                    value={formData.notes}
                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                    className="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-[#191265]"
                  />
                </div>

                {/* 등록 버튼 */}
                <button
                  type="submit"
                  className="w-full py-3.5 bg-[#191265] text-white font-extrabold text-sm rounded-xl shadow-lg hover:bg-[#130e50] active:scale-[0.99] transition-all flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-paper-plane text-yellow-400"></i>
                  [{selectedFactory}] 출퇴근 등록하기
                </button>
              </form>
            </div>
          )}

          {/* 월별 내역 조회/수정 */}
          {currentView === 'history' && (
            <div className="p-3 space-y-3">
              <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
                <div className="flex items-center justify-between mb-2">
                  <h2 className="text-xs font-bold text-slate-700">
                    <i className="fa-solid fa-table-list mr-1 text-[#191265]"></i> 등록 내역 현황 (총 {records.length}건)
                  </h2>
                </div>
                {records.length === 0 ? (
                  <p className="text-center text-xs text-slate-400 py-6">등록된 출퇴근 내역이 없습니다.</p>
                ) : (
                  <div className="space-y-2">
                    {records.map(rec => (
                      <div key={rec.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                        <div>
                          <div className="flex items-center gap-1.5 mb-1">
                            <span className="bg-[#191265] text-white text-[10px] px-1.5 py-0.5 rounded font-bold">
                              {rec.factory}
                            </span>
                            <span className="font-bold text-slate-800">{rec.workerName}</span>
                            <span className="text-slate-500 text-[11px]">({rec.workDate} {rec.dayOfWeek})</span>
                          </div>
                          <p className="text-slate-600 text-[11px]">
                            근무: {rec.inTime} ~ {rec.outTime} | 확인자: {rec.checker}
                          </p>
                          {rec.reason && <p className="text-slate-500 text-[10px] mt-0.5">사유: {rec.reason}</p>}
                          {rec.notes && <p className="text-slate-400 text-[10px] mt-0.5">기타: {rec.notes}</p>}
                        </div>
                        <button
                          onClick={() => handleDeleteRecord(rec.id)}
                          className="p-2 text-red-500 hover:bg-red-50 rounded-lg text-xs transition-colors"
                          title="삭제"
                        >
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 알림 토스트 */}
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-5 py-3 rounded-full text-xs font-bold shadow-2xl z-50 flex items-center gap-2">
              <i className="fa-solid fa-circle-check text-yellow-300"></i>
              {toastMessage}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
